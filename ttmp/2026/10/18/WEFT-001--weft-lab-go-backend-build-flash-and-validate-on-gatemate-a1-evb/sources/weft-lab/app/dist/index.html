      A participant that proposes changes \xB7 F-18, F-19

The API as typed declarations, the IR's opcodes, the pass catalogue and the diagnostics. The declarations are TypeScript notation for reference only; the implementation is JavaScript. HW marks a hardware lambda (parsed, never called) and RT a runtime lambda.

## API declarations
// ---- types and lambdas ----
interface Type { readonly width: number; readonly signed: boolean; init(v: number | bigint | object): Type }
declare function u(n: number): Type;           declare function s(n: number): Type;
declare const bit: Type, pulse: Type;
declare function vec(t: Type, n: number): Type; declare function struct(f: Record<string, Type>): Type;
type Params = Record<string, unknown>;
type Env = { clock: { name: string; hz: number }; part: string; board?: string };
type Lazy<T> = T | ((p: Params, env: Env) => T);       // a builder lambda of params (D2, D3)
type HW = ($: any, ...args: any[]) => any;             // parsed into HIR, never called
type RT<A extends any[], R> = (...a: A) => R;           // ordinary JS, runs beside sim or board
type Dur = string;                                      // "250ms", "1s", "48 kHz"

// ---- components: module(), fsm(), pipeline() ----
interface Component<Self> {
  readonly name: string;
  params(p: Params): Self;                 require(check: (p: Params) => true | string): Self;
  in(name: string, t: Lazy<Type>): Self;   in(ports: Record<string, Lazy<Type>>): Self;
  out(name: string, t: Lazy<Type>): Self;  out(ports: Record<string, Lazy<Type>>): Self;
  regs(r: Lazy<Record<string, Type>>): Self;
  seq(f: HW): Self;  comb(f: HW): Self;  every(d: Dur, f: HW): Self;
  on(event: string, f: HW): Self;          // a stream name, "port.rise" or "port.fall"
  provides(...streams: string[]): Self;    needs(...streams: string[]): Self;
  lib(v: Lazy<Record<string, unknown>>): Self;
  bind(m: Record<string, string>): Self;   domain(name: string): Self;
  ram(name: string, o: { of: Type; words: number; rdw?: "read-first" | "write-first" }): Self;
  knob(name: string, t: Type, o?: { reset?: number; min?: number; max?: number; doc?: string }): Self;
  status(name: string, t: Type): Self;     irq(name: string): Self;
  budget(f: (b: Budget) => Budget): Self;  hint(h: Lazy<Record<string, string>>): Self;
  pipelined(o: { path: [string, string] }): Self;
  assert(name: string, f: HW): Self;  assume(name: string, f: HW): Self;  cover(name: string, f: HW): Self;
  supervise(f: (s: Supervisor) => Supervisor): Self;  probe(f: (p: Probe) => Probe): Self;
  migrate(f: RT<[Record<string, number>], Record<string, number>>): Self;
  with(p: Params): Self;  as(name: string): Self;
}
interface Fsm extends Component<Fsm> {
  initial(s: string): Fsm;  state(s: string, f: HW): Fsm;  step(stream: string): Fsm;
  encode(e: "auto" | "binary" | "onehot" | "gray"): Fsm;
}
interface Pipeline extends Component<Pipeline> { stage(name: string, f: HW): Pipeline; stall(k: "global" | "skid"): Pipeline }
interface Budget { luts(n: number): Budget; ffs(n: number): Budget; brams(n: number): Budget; dsps(n: number): Budget }
interface Supervisor { watchdog(d: Dur, alive: HW): Supervisor; reset(k: "local"): Supervisor;
  strategy(k: "one-for-one" | "all-for-one" | "dependents"): Supervisor; maxResets(n: number, window: Dur): Supervisor; escalate(agent: string): Supervisor }
interface Probe { signals(...names: string[]): Probe; depth(n: number): Probe; keep(k: "before-reset" | "on-trigger"): Probe }

// ---- streams, memories, groups ----
interface Stream { of(t: Type): Stream; buffer(n: number, o?: { overflow: "block" | "drop-oldest" | "drop-newest" | "latest" }): Stream;
  cross(o: { from: string; to: string }): Stream }
interface Rom { of(t: Type): Rom; from(n: number, f: (i: number) => number): Rom }
interface Group { children(...names: string[]): Group; supervise(f: (s: Supervisor) => Supervisor): Group }

// ---- designs ----
type Level = "hir" | "dag" | "net" | "phys";
interface Design {
  board(b: string | Board): Design;  boards(m: Record<string, Board>): Design;  part(p: string): Design;
  clocks(f: (c: Clocks) => Clocks): Design;
  use(...items: unknown[]): Design;
  wire(from: string, to: string): Design;  wire(pairs: [string, string][]): Design;  pins(m: Record<string, string>): Design;
  regions(f: (r: Regions) => Regions): Design;  place(m: Record<string, string>): Design;
  record(o: { streams?: string[]; inputs?: boolean; keep: Dur }): Design;
  boot(f: (b: Boot) => Boot): Design;
  compile(f?: (c: Compiler) => Compiler): Design;
  prove(f: (p: Prover) => Prover): Design;
  scenario(name: string, f: ((sc: Sc) => Sc) | RT<[Tb], Promise<void>>, o?: { levels?: Level[]; targets?: "all" | string[] }): Design;
}
interface Board { part(p: string): Board }
interface Clocks { pin(name: string, resource: string): Clocks; port(name: string, o: { hz: string }): Clocks;
  pll(name: string, o: { from: string; hz: string; tolerance?: string }): Clocks }
interface Boot { start(...g: string[]): Boot; then(...g: string[]): Boot; background(...g: string[]): Boot }
interface Prover { module(name: string): Prover; bmc(k: number): Prover; induction(): Prover; engine(e: "smt" | "abc-pdr"): Prover }

// ---- the compiler ----
interface Compiler {
  use(p: PassPipeline): Compiler;  stage(name: string, f: (s: Stage) => Stage): Compiler;
  after(at: string, f: (s: Stage) => Stage): Compiler;  before(at: string, f: (s: Stage) => Stage): Compiler;
  replace(name: string, p: Pass): Compiler;  without(name: string): Compiler;
  when(pred: (t: Target) => boolean, f: (c: Compiler) => Compiler): Compiler;
  cache(dir: string): Compiler;  verifyEach(): Compiler;  validate(o?: { passes?: string[] }): Compiler;   // validate: D10
  snapshot(l: Level, o: { after: string; as: "dot" | "text" | "json"; to: string }): Compiler;
  inspect(l: Level, f: (ir: IR) => void, o?: { after: string }): Compiler;
  check(name: string, f: (r: Report, t: Target) => true | string): Compiler;
  emit(b: string | Backend, o?: { to?: string | ((t: Target) => string); level?: Level }): Compiler;
  explore(f: (x: Explorer) => Explorer): Compiler;  explainPlan(): Compiler;
}
interface Stage { pass(...p: Pass[]): Stage; fixpoint(o: { max: number }): Stage }
interface PassB { on(l: Level): PassB; requires(...a: Array<Analysis | string>): PassB; preserves(...names: string[]): PassB;
  params(p: Params): PassB; visit(op: string | string[], f: (n: Node, g: IR, ctx: Record<string, unknown>) => void): PassB;
  run(f: (g: IR, ctx: Record<string, unknown>) => void): PassB; readonly(): PassB; with(p: Params): PassB }
interface AnalysisB { on(l: Level): AnalysisB; run(f: (g: IR) => unknown): AnalysisB }
interface RewriteB { from(p: HW): RewriteB; where(f: (m: Record<string, Node>) => boolean): RewriteB; to(r: HW): RewriteB;
  examples(e: Array<[HW, HW | null]>): RewriteB }
interface BackendB { on(l: Level): BackendB; emit(f: (ir: IR, out: { file(path: string, text: string): void }) => void): BackendB }
interface Explorer { knob(path: string, values: unknown[]): Explorer; measure(f: (r: Report) => Record<string, unknown>): Explorer;
  keep(f: (m: Record<string, unknown>) => boolean): Explorer; pareto(keys: string[]): Explorer; parallel(n: number): Explorer; report(path: string): Explorer }

// ---- runtime, changes, agents ----
interface Tb { poke(path: string, v: number): Promise<void>; peek(path: string): Promise<number>; step(n?: number): Promise<void>;
  wait(d: Dur): Promise<void>; set(pins: string, v: number): Promise<void>; measure(pin: string, o: { over: Dur }): Promise<number>;
  push(stream: string, beats: unknown | unknown[]): Promise<void>; pull(stream: string, n?: number): Promise<unknown>;
  random: { int(lo: number, hi: number): number }; expect(c: boolean, msg?: string): void;
  expectEqual(a: unknown, b: unknown, msg?: string): void; expectCoverage(k: "all" | string[]): void }
interface Host { over(bridge: string): Host; onStart(f: RT<[Dev], unknown>): Host; every(d: Dur, f: RT<[Dev], unknown>): Host;
  on(event: string, f: RT<[Dev, unknown], unknown>): Host }
interface Dev { knob(path: string): { get(): Promise<number>; set(v: number): Promise<void>; update(f: (v: number) => number): Promise<void> };
  status(path: string): { read(): Promise<number> }; registers(): Promise<unknown>; clock: { seconds(): number }; log(...a: unknown[]): void }
interface Change { knob(path: string, v: number): Change; patch(module: string, p: { lib?: Record<string, unknown>; on?: Record<string, HW>; seq?: HW; comb?: HW }): Change;
  replace(module: string, m: Component<any>): Change; verify(f: (v: Verify) => Verify): Change;
  deploy(f: (d: Deploy) => Deploy): Change; rollbackOn(...events: Array<"assert" | "stall" | "watchdog" | "timing">): Change }
interface Verify { lint(): Verify; ports(k: "same"): Verify; replay(window: string): Verify; timing(): Verify; equiv(o?: { upTo?: "stream latency" }): Verify }
interface Deploy { partial(region: string): Deploy; canary(d: Dur, o?: { watch: string[] }): Deploy }
interface Agent { model(m: string): Agent; guidelines(t: string): Agent; scope(f: (s: Scope) => Scope): Agent;
  budget(o: { proposals: number; per: string }): Agent; on(event: string, f: RT<[Ctx, unknown], unknown>): Agent }

## IR opcodes
  in
      the port's type \xB7 Value of an input port this cycle
  out
      x \xB7 the port's type \xB7 Drives an output port
  const
      narrowest type (D1), or attrs.type \xB7 A literal; attrs.value is a BigInt, and attrs.type keeps a declared type when folding produced the constant
  reg
      \u2014; next set separately \xB7 declared type \xB7 Q of a register; attrs.init, domain; next is its D input
  add, sub
      a, b \xB7 D1 \xB7 Exact sum or difference; cannot overflow its own type
  mul
      a, b \xB7 w_a + w_b bits \xB7 Exact product
  neg
      a \xB7 s(n + 1) \xB7 Exact negation
  and, or, xor
      a, b \xB7 the wider operand \xB7 Bitwise, after extension
  not
      a \xB7 same \xB7 Bitwise inversion
  shl, shr, ashr
      a, k \xB7 constant k: w \xB1 k; dynamic k: shl w + 2^w_k \u2212 1, shr w \xB7 Shifts; ashr keeps the sign
  eq, ne, lt, le, gt, ge
      a, b \xB7 bit \xB7 Comparisons; attrs.signed
  mux
      c, t, f \xB7 smallest type holding t and f \xB7 c ? t : f
  concat
      a, b, \u2026 \xB7 sum of widths \xB7 The first operand is most significant
  slice
      a \xB7 hi \u2212 lo + 1 bits \xB7 Bits hi..lo; wrap() lowers to it
  sext, zext
      a \xB7 attrs.width \xB7 Sign or zero extension
  sat
      a \xB7 target type \xB7 Clamp to the target's range
  mem
      One memory; attrs.words, rdw, init
  memrd
      mem, addr, en \xB7 element type \xB7 Read port; the address is registered inside the port and the data appears on the next cycle (D8)
  memwr
      mem, addr, data, en \xB7 Write port; writes at the edge when en is high
  rom
      index \xB7 element type \xB7 Combinational table read; attrs.table, type
  cell
      inputs \xB7 attrs.outputs \xB7 A technology cell at level net: LUT, FF, CARRY, DSP, RAM
  probe
      x, \u2026 \xB7 Marks signals for scenarios and on-chip capture
Pure opcodes are hash-consed on (op, args, type, attrs). in, out, reg, mem, memrd, memwr and probe are never merged.

## Pass catalogue
  parse
      front \xB7 source \u2192 hir \xB7 Parses hardware lambdas; runs the capture check (D2)
  elaborate
      front \xB7 hir \xB7 Applies params, .with(), .require(); memoizes specializations (D3)
  link
      front \xB7 hir \xB7 Joins provides/needs, .wire() and pins; inserts forks; reports unmet-need, multi-producer, pin-claimed
  fsm.extract
      lower \xB7 hir \xB7 States and returns \u2192 transition graph and next-state logic
  pipeline.registers
      lower \xB7 hir \xB7 Inserts registers for values live across stages
  stream.lower
      lower \xB7 hir \xB7 Handshakes, buffers by depth and policy, drop counters (D7)
  csr.collect
      lower \xB7 hir \xB7 Gathers knobs, status and irqs into one register map and a bus slave
  flatten
      lower \xB7 hir \u2192 dag \xB7 Merges blocks (D4), removes hierarchy, one DAG per domain
  widths
      lower \xB7 dag \xB7 Infers and enforces D1
  checks.loops
      lower \xB7 dag \xB7 Rejects combinational cycles (comb-loop)
  checks.latches
      lower \xB7 dag \xB7 Rejects wires not assigned on every path (latch)
  checks.cdc
      lower \xB7 dag \xB7 Propagates domains; rejects unmarked crossings (cdc)
  constFold
      optimize \xB7 dag \xB7 Evaluates nodes whose operands are constants
  cse
      optimize \xB7 dag \xB7 Merges structurally equal pure nodes
  muxTree
      optimize \xB7 dag \xB7 Flattens and simplifies nested multiplexers
  dce
      optimize \xB7 dag \xB7 Removes nodes that reach no output, register or probe; narrows unused high bits
  pipeline.cut
      time \xB7 dag \xB7 Places pipeline stages on .pipelined() paths to meet the clock
  retime
      time \xB7 dag \xB7 Moves registers on .pipelined() paths (Leiserson\u2013Saxe)
  mem.infer
      map \xB7 dag \u2192 net \xB7 Maps memories and registered ROM reads to RAM cells (D8)
  dsp.pack
      map \xB7 dag \u2192 net \xB7 Folds multiply, add and register into DSP cells
  fsm.encode
      map \xB7 dag \xB7 Chooses state encodings (D12)
  srl.infer
      map \xB7 net \xB7 7-series only: shift-register chains to SRL16/SRL32 cells
  techmap
      map \xB7 dag \u2192 net \xB7 Maps logic to the part's LUTs and carry chains
  place
      back \xB7 net \u2192 phys \xB7 Assigns each cell a site
  route
      back \xB7 phys \xB7 Assigns each net a path
  timing
      back \xB7 phys \xB7 Static timing analysis; error timing on negative slack

## Diagnostics
  capture
      error \xB7 parse \xB7 A hardware lambda uses a name outside $, the prelude, params and .lib()
  lib-shadows-param
      error \xB7 parse \xB7 A .lib() name equals a parameter name
  lib-value
      error \xB7 parse \xB7 A shipped value has no hardware meaning (a Map, a class instance)
  unroll-bound
      error \xB7 parse \xB7 A loop bound is not constant, or exceeds 4096 iterations
  temporal-position
      error \xB7 parse \xB7 within() or sequence() used outside the positions R9.2 allows
  mem-read-value
      error \xB7 parse \xB7 $.m.read(a) used as an expression; read data arrives in $.m.q on the next cycle
  require
      error \xB7 elaborate \xB7 A .require() check returned a message
  unmet-need
      error \xB7 link \xB7 A needed stream has no producer
  multi-producer
      error \xB7 link \xB7 Two modules provide one stream
  pin-claimed
      error \xB7 link \xB7 Two modules bind one output resource
  fsm-target
      error \xB7 fsm.extract \xB7 An initial or returned state is not a declared state
  fsm-unreachable
      warning \xB7 fsm.extract \xB7 A state cannot be reached from the initial state
  every-no-clock
      error \xB7 lower \xB7 .every() in a domain without a known frequency
  width
      error \xB7 widths \xB7 A narrowing assignment without wrap() or sat()
  rom-index
      error \xB7 widths \xB7 A ROM index type is wider than \u2308log2 n\u2309 bits for an n-entry table
  mixed-kind
      error \xB7 flatten \xB7 A signal written in a clocked block and in .comb
  multi-driver
      error \xB7 flatten \xB7 Two .comb blocks write one wire
  multi-writer
      warning \xB7 flatten \xB7 Two clocked blocks can write one register on the same cycle; a witness is shown
  mem-ports
      error \xB7 flatten \xB7 Two reads or two writes of one .ram() can happen on the same cycle; a witness is shown
  comb-read-before-write
      error \xB7 flatten \xB7 A .comb lambda reads a wire before writing it
  latch
      error \xB7 checks.latches \xB7 A wire is not assigned on every path
  comb-loop
      error \xB7 checks.loops \xB7 A cycle without a register
  cdc
      error \xB7 checks.cdc \xB7 A signal crosses domains without .cross() or a crossing cell
  pll
      error \xB7 lower \xB7 No PLL or MMCM setting meets every requested output of one PLL within tolerance and VCO limits
  region
      error \xB7 lower \xB7 A raw wire crosses a reconfigurable region's boundary; only streams and knobs may (R15.5)
  record-budget
      error \xB7 map \xB7 A .record() window does not fit the board's memory or host link (R15.7)
  rule-unsound
      error \xB7 rewrite engine \xB7 A rewrite rule fails its proof at some width (D10)
  lint
      warning \xB7 a readonly pass \xB7 A message from g.warn(), reported at the node's source line
  budget
      error \xB7 map \xB7 A module exceeds its .budget()
  timing
      error \xB7 timing \xB7 Negative slack after routing; the path is reported by source line
  stream-protocol
      error \xB7 simulation \xB7 Valid fell, or data changed, before a beat fired (D7)
  assert
      error \xB7 simulation, proof \xB7 An assertion failed; the trace or counterexample is attached
  assume-violated
      error \xB7 simulation \xB7 The stimulus broke an assumption: a testbench bug, not a design bug
  vacuous
      warning \xB7 proof \xB7 No run satisfies the assumptions to the requested depth, so every assertion holds trivially
`,ji=`You are the architect in Weft Lab, a browser IDE for Weft: a JavaScript API for designing FPGA hardware. The user edits a script (the body of a function that returns design(\u2026)); the Lab compiles it through a multi-pass compiler to one dataflow DAG per clock domain, simulates it cycle by cycle on a virtual board, runs its scenarios, proves its properties, estimates resources and timing, and applies changes to the running design through a change pipeline.

How to work
- Look before you change. Read the script with editor.get(), the diagnostics with editor.check(), and the state of the board with io.* and report(). Say what you found in a sentence or two.
- Make the smallest edit that does the job, with editor.edit(find, replace), and check its diagnostics. Keep the file's header comment (/** F-NN Title \u2026 */) and its style: short lines, builders chained one per line, a comment where a reader would stop.
- Prove it works. Boot it (editor.boot({ run: "50ms" })), drive the board (io.press, io.toggle, io.uart), read pins, registers and streams, and run the scenarios (scenarios.runAll()). Add a scenario when you add behaviour.
- Report evidence, not hope: a table (chat.table), a register value, a scenario result, the slack from report(). Link to lines as [line 12](lab:line?n=12) and to tabs as [Waves](lab:tab?name=waves).
- Stop when the change works or when you need a decision from the user. Never loop on the same failing step: explain what blocks you.

The grammar's three kinds of lambda
- Builder lambdas run now, in JS, while the script is evaluated: they compute tables, widths and parameters.
- Hardware lambdas ($ => \u2026) are parsed into the IR and never called. They see only $, their arguments, the hardware prelude (u, s, bit, pulse, wrap, sat, clog2, past, within, \u2026), the module's params and what .lib() ships. Using any other JS variable is a \`capture\` error: ship it with .lib({ NAME }).
- Runtime lambdas (host(), scenario checks, .migrate(), agent handlers) are ordinary JS that runs beside the simulator or the board.

Hardware facts that matter
- Widths grow (D1): u8 + u8 is u9, u8 - u8 is s9, a product is the sum of the widths. Putting a wider value into a narrower register needs wrap() or sat(); compound assignments (+=, -=) wrap by definition.
- What a clocked block (.seq, .every, .on) writes is a register; what .comb writes is a wire that must be assigned on every path.
- Streams are valid/ready channels linked by name (.provides / .needs). A beat fires when valid and ready are both high. Buffers choose a policy: block, drop-oldest, drop-newest, latest.
- RAM reads take a cycle: $.mem.read(a) now, $.mem.q on the next cycle.
- Signals crossing clock domains need stream(\u2026).cross() or a crossing cell; otherwise checks.cdc refuses the build.
- Knobs (.knob) are registers the host may write at runtime, clamped to [min, max] in hardware; changing one is a register write, not a rebuild.
- Timing is estimated from a per-family delay model: deep adder trees, wide multiplies and long mux chains are the usual critical paths. Fixes: .pipelined() on a stream path, a ROM instead of logic, narrower types, or fewer levels.

The board
- pico: iCE40 UP5K, 12 MHz, led:0..2, btn:user, uart. dev: Artix-7 xc7a35t, 100 MHz, led:0..7, btn:0..3, sw:0..7, uart, hdmi, audio. studio: like dev with btn:up, btn:down, btn:a, btn:b.
- Simulated time is in picoseconds. A 100 MHz domain runs 100,000 cycles per simulated millisecond; run in milliseconds, not seconds, unless the design is slow.
