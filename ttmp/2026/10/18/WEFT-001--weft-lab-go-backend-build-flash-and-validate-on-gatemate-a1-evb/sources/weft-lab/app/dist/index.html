const GAMMA = Array.from({ length: 256 }, (_, i) => Math.round(255 * (i / 255) ** 2.2));   // build-time JS
const gamma = v => GAMMA[v];

const dimmer = module("dimmer")
  .in("level", u(8))
  .out("pwm", bit)
  .regs({ phase: u(8) })
  .budget(b => b.luts(120).brams(0))                // builder lambda: runs now, while the graph is built
  .seq($ => {                                       // hardware lambda: parsed into IR nodes, never called
    $.phase += 1;
    $.pwm = $.phase < gamma($.level);              // \u2715 captures the JS binding \`gamma\`
  });
  // the fix: .lib({ GAMMA, gamma }). GAMMA becomes a 256 \xD7 8 ROM; gamma is re-parsed and inlined at the call

return design("lambdas")
  .board("dev")
  .use(dimmer)
  .pins({ "dimmer.level": "sw:0..7", "dimmer.pwm": "led:0" })
  .scenario("half the switches, a fifth of the light", async tb => {   // runtime lambda: plain async JS
    await tb.set("sw:0..7", 128);
    const duty = await tb.measure("led:0", { over: "1ms" });          // the fraction of time it was high
    tb.expect(Math.abs(duty - GAMMA[128] / 256) < 0.01);              // runtime lambdas may use JS values freely
  });
`},{id:"F-04",title:"Parameters and generators",group:"Basics",about:"Builders are values: every call returns a new one, so a module can be shared, specialized with .with() and stamped out in a plain JS loop. Any builder argument may be a lambda of the parameters; it runs once per specialization. Parameters reach hardware lambdas as constants, so loops over them unroll.",shows:[".params()",".with()",".as()","builder lambdas of params","unrolled loops",'"generate" is just JS'],watch:"DAG (instances)",tries:["Make channel 7 a 12-bit PWM","Put the eight phases 45\xB0 apart"],file:"F-04-generators.js",text:`/** F-04 Parameters and generators
 *  group  Basics
 *  about  Builders are values: every call returns a new one, so a module can be shared, specialized with .with()
 *         and stamped out in a plain JS loop. Any builder argument may be a lambda of the parameters; it runs once
 *         per specialization. Parameters reach hardware lambdas as constants, so loops over them unroll.
 *  shows  .params() \xB7 .with() \xB7 .as() \xB7 builder lambdas of params \xB7 unrolled loops \xB7 "generate" is just JS
 *  watch  DAG (instances)
 *  try    Make channel 7 a 12-bit PWM | Put the eight phases 45\xB0 apart
 */
const pwm = module("pwm")
  .params({ BITS: 8 })
  .in("duty", ({ BITS }) => u(BITS))                // a builder lambda of params: runs per specialization
  .out("out", bit)
  .regs(({ BITS }) => ({ phase: u(BITS) }))
  .seq($ => {
    $.phase += 1;
    $.out = $.phase < $.duty;
  });

const breathe = module("breathe")
  .params({ N: 4 })
  .out("duty", ({ N }) => vec(u(8), N))
  .regs({ level: u(8), up: bit.init(1) })
  .every("4ms", $ => {
    const up = $.level === 0 ? 1 : $.level === 255 ? 0 : $.up;   // locals are wires
    $.up = up;
    if (up) $.level += 1;
    else $.level -= 1;
  })
  .comb($ => {
    for (let i = 0; i < N; i++) $.duty[i] = wrap($.level + i * 32);   // N is a constant here, so the loop unrolls
  });

const bank = Array.from({ length: 8 }, (_, i) => pwm.as(\`pwm-\${i}\`));   // eight instances of one value

return design("breathing")
  .board("dev")
  .use(breathe.with({ N: bank.length }), ...bank)
  .wire(bank.map((p, i) => [\`breathe.duty[\${i}]\`, \`\${p.name}.duty\`]))
  .pins(Object.fromEntries(bank.map((p, i) => [\`\${p.name}.out\`, \`led:\${i}\`])))
  .scenario("eight different phases", sc => sc
    .wait("300ms")
    .expectSignal("breathe.duty", d => new Set(d).size === 8));
`},{id:"F-05",title:"Buttons and events",group:"Components",about:"std.debounce cleans four raw buttons and provides a stream of presses. The lights module needs that stream; the link pass connects producer to consumer by name, with no wiring written. Handlers fire on stream beats and on edges of input ports.",shows:["std components",".provides() / .needs()",".on(stream)",'.on("port.rise")',"exclusive pin binding"],watch:"Board \xB7 DAG (links)",tries:["Bind a second module to led:0..7 and read the error","Clear on a double press instead of a long one"],file:"F-05-buttons.js",text:`/** F-05 Buttons and events
 *  group  Components
 *  about  std.debounce cleans four raw buttons and provides a stream of presses. The lights module needs that
 *         stream; the link pass connects producer to consumer by name, with no wiring written. Handlers fire on
 *         stream beats and on edges of input ports.
 *  shows  std components \xB7 .provides() / .needs() \xB7 .on(stream) \xB7 .on("port.rise") \xB7 exclusive pin binding
 *  watch  Board \xB7 DAG (links)
 *  try    Bind a second module to led:0..7 and read the error | Clear on a double press instead of a long one
 */
const buttons = std.debounce("buttons")
  .bind({ raw: "btn:0..3" })
  .settle("10ms")                                   // an edge must hold for 10 ms to count
  .longPress("500ms")                               // presses carry { id: u(2), long: bit }
  .provides("presses");

const lights = module("lights")
  .needs("presses")
  .in("invert", bit)
  .out("leds", u(8))
  .on("presses", ($, p) => {                        // runs on the cycle a beat arrives; ready is handled for you
    $.leds = p.long ? 0 : $.leds ^ (1 << p.id);
  })
  .on("invert.rise", $ => { $.leds = ~$.leds; })    // an edge of an input port is an event too
  .bind({ invert: "sw:0", leds: "led:0..7" });      // led:0..7 now belongs to lights; a second binder is an error

return design("lights")
  .board("dev")
  .use(buttons, lights)                             // no .wire(): "presses" links by name
  .scenario("toggle, invert, clear", sc => sc
    .press("btn:2").wait("20ms").expectPins("led:0..7", 0b0000_0100)
    .press("btn:0", { bounce: "3ms" }).wait("20ms").expectPins("led:0..7", 0b0000_0101)   // chatter counts once
    .toggle("sw:0").wait("1ms").expectPins("led:0..7", 0b1111_1010)
    .press("btn:1", { for: "600ms" }).wait("20ms").expectPins("led:0..7", 0));
`},{id:"F-06",title:"State machines",group:"Components",about:"A UART transmitter written as an fsm. Each state is a hardware lambda: it drives outputs, writes registers and returns the next state; returning nothing stays put. fsm.extract reads the returns to build the transition graph, and fsm.encode picks an encoding for the part.",shows:["fsm()","states as lambdas",".lib() from params and the clock","a hardware helper","$.has() / $.take()"],watch:"DAG (fsm) \xB7 Board (serial)",tries:["Add an even-parity state",'Force .encode("onehot") and compare LUTs in the report'],file:"F-06-fsm.js",text:`/** F-06 State machines
 *  group  Components
 *  about  A UART transmitter written as an fsm. Each state is a hardware lambda: it drives outputs, writes
 *         registers and returns the next state; returning nothing stays put. fsm.extract reads the returns to
 *         build the transition graph, and fsm.encode picks an encoding for the part.
 *  shows  fsm() \xB7 states as lambdas \xB7 .lib() from params and the clock \xB7 a hardware helper \xB7 $.has() / $.take()
 *  watch  DAG (fsm) \xB7 Board (serial)
 *  try    Add an even-parity state | Force .encode("onehot") and compare LUTs in the report
 */
const greeter = module("greeter")
  .provides("bytes")
  .lib({ MSG: [..."hello\\r\\n"].map(ch => ch.charCodeAt(0)) })   // an array of numbers becomes a 7-entry ROM
  .regs({ i: u(3), go: bit })
  .every("1s", $ => { $.go = 1; })
  .seq($ => {
    if ($.go && $.push("bytes", MSG[$.i])) {        // push() is 1 on the cycle the beat is taken
      if ($.i === MSG.length - 1) { $.i = 0; $.go = 0; }
      else $.i += 1;
    }
  });

function baud($) {                                  // a hardware helper: shipped by .lib(), inlined where called
  if ($.wait !== 0) { $.wait -= 1; return 0; }
  $.wait = DIV;
  return 1;
}

const tx = fsm("uart-tx")
  .params({ BAUD: 115_200 })
  .needs("bytes")
  .out("line", bit.init(1))                         // a UART line idles high
  .regs({ shift: u(8), n: u(3), wait: u(16) })
  .lib(({ BAUD }, { clock }) => ({ DIV: Math.round(clock.hz / BAUD) - 1 }))   // builder lambda: params and clock
  .lib({ baud })
  .initial("idle")
  .state("idle", $ => {
    $.line = 1;
    if ($.has("bytes")) { $.shift = $.take("bytes"); $.wait = DIV; return "start"; }
  })
  .state("start", $ => { $.line = 0; if (baud($)) return "data"; })
  .state("data", $ => {
    $.line = $.shift[0];
    if (!baud($)) return;
    $.shift >>= 1;
    $.n += 1;                                       // wraps back to 0 after the eighth bit
    if ($.n === 7) return "stop";
  })
  .state("stop", $ => { $.line = 1; if (baud($)) return "idle"; });

return design("hello-uart")
  .board("pico")                                    // 12 MHz, so DIV = 103
  .use(stream("bytes").of(u(8)).buffer(8, { overflow: "block" }), greeter, tx)
  .pins({ "uart-tx.line": "uart.tx" })
  .scenario("says hello every second", sc => sc
    .expectUart("uart", "hello\\r\\n", { within: "1.1s", baud: 115_200 })
    .expectUart("uart", "hello\\r\\n", { within: "1.1s", baud: 115_200 }));
`},{id:"F-07",title:"Backpressure",group:"Components",about:`Four fast producers, four slow consumers, four buffered streams with four overflow policies. "block" holds ready low and its producer waits; the lossy ones keep going and count what they drop, in hardware, where the host can read it. stream.lower picks each buffer's implementation from its depth.`,shows:["stream().buffer() overflow policies","$.push() / $.has() / $.take()","generator loops","drop counters"],watch:"DAG (queues) \xB7 Waves",tries:["Make one consumer twice as fast","Give q.block a depth of 512 and watch it move to block RAM"],file:"F-07-backpressure.js",text:`/** F-07 Backpressure
 *  group  Components
 *  about  Four fast producers, four slow consumers, four buffered streams with four overflow policies. "block"
 *         holds ready low and its producer waits; the lossy ones keep going and count what they drop, in hardware,
 *         where the host can read it. stream.lower picks each buffer's implementation from its depth.
 *  shows  stream().buffer() overflow policies \xB7 $.push() / $.has() / $.take() \xB7 generator loops \xB7 drop counters
 *  watch  DAG (queues) \xB7 Waves
 *  try    Make one consumer twice as fast | Give q.block a depth of 512 and watch it move to block RAM
 */
const policies = {
  "q.block":  { depth: 16, overflow: "block" },
  "q.oldest": { depth: 16, overflow: "drop-oldest" },
  "q.newest": { depth: 16, overflow: "drop-newest" },
  "q.latest": { depth: 1,  overflow: "latest" },      // a register: the consumer always sees the freshest value
};
const names = Object.keys(policies);

const queues = names.map(n => stream(n)             // depth 1 \u2192 a register, 16 \u2192 LUT RAM, \u2265 64 \u2192 block RAM
  .of(u(16))
  .buffer(policies[n].depth, { overflow: policies[n].overflow }));

const producers = names.map(n => module(\`fast-\${n.slice(2)}\`)
  .provides(n)
  .lib({ Q: n })                                    // a constant string names the stream inside the lambda
  .regs({ seq: u(16) })
  .seq($ => { if ($.push(Q, $.seq)) $.seq += 1; })); // a lossy stream always accepts; "block" may not

const consumers = names.map(n => module(\`slow-\${n.slice(2)}\`)
  .needs(n)
  .lib({ Q: n })
  .regs({ last: u(16).init(0xffff), gaps: u(16), busy: u(2) })
  .seq($ => {
    $.busy += 1;                                    // ready on one cycle in four
    if ($.busy === 0 && $.has(Q)) {
      const v = $.take(Q);
      if (v !== wrap($.last + 1)) $.gaps += 1;
      $.last = v;
    }
  }));

return design("backpressure")
  .board("dev")
  .use(...queues, ...producers, ...consumers)
  .scenario("only block is lossless", sc => sc
    .step(4000)
    .expectState("slow-block", s => s.gaps === 0)
    .expectState("slow-oldest", s => s.gaps > 0)
    .expectState("slow-latest", s => s.gaps > 0)
    .expectDropped("q.block", 0)
    .expectDropped("q.newest", n => n > 2000));
`},{id:"F-08",title:"Tables and memories",group:"Components",about:"A direct digital synthesizer feeding an echo. A builder lambda fills the sine table; the delay line is a RAM that mem.infer puts in block RAM. RAM reads take a cycle, and the grammar makes you say so.",shows:["rom().from()",".ram()",'.every("48 kHz")',"sat()","std.sigmaDelta","a check on the build report"],watch:"Board (audio) \xB7 Report (memories)",tries:["Store a quarter wave and mirror it","Make the echo half a second long and read the BRAM count"],file:"F-08-memories.js",text:`/** F-08 Tables and memories
 *  group  Components
 *  about  A direct digital synthesizer feeding an echo. A builder lambda fills the sine table; the delay line is a
 *         RAM that mem.infer puts in block RAM. RAM reads take a cycle, and the grammar makes you say so.
 *  shows  rom().from() \xB7 .ram() \xB7 .every("48 kHz") \xB7 sat() \xB7 std.sigmaDelta \xB7 a check on the build report
 *  watch  Board (audio) \xB7 Report (memories)
 *  try    Store a quarter wave and mirror it | Make the echo half a second long and read the BRAM count
 */
const sine = rom("sine")
  .of(s(12))
  .from(1024, i => Math.round(2047 * Math.sin((2 * Math.PI * i) / 1024)));   // builder lambda, called 1024 times now

const osc = module("osc")
  .params({ HZ: 440 })
  .provides("dry")
  .lib({ SINE: sine })                              // a rom shipped by .lib() is instanced in this module
  .lib(({ HZ }) => ({ STEP: Math.round((HZ * 2 ** 32) / 48_000) }))   // the tuning word, computed at build time
  .regs({ phase: u(32) })
  .every("48 kHz", $ => {
    $.phase += STEP;
    $.push("dry", SINE[$.phase.bits(31, 22)]);      // the top ten bits index the table
  });

const echo = module("echo")
  .needs("dry").provides("wet")
  .ram("delay", { of: s(12), words: 8192 })         // 8192 \xD7 12 bits
  .regs({ at: u(13) })
  .on("dry", ($, x) => {
    const back = $.delay.q;                         // what the last read() returned: reads take a cycle
    const y = sat(x + (back >> 1), s(12));          // 13 bits back into 12 by saturating, never by accident
    $.delay.write($.at, y);
    $.delay.read(wrap($.at + 1));                   // the oldest sample, ready by the next beat
    $.at += 1;
    $.push("wet", y);
  });

return design("echo")
  .board("dev")
  .use(stream("dry").of(s(12)), stream("wet").of(s(12)), osc, echo)
  .use(std.sigmaDelta("dac").needs("wet").bind({ out: "audio" }))
  .compile(c => c                                   // the default pipeline, plus one check (more in F-13)
    .check("the delay line is block RAM", r => r.resources.of("echo").brams >= 1))
  .scenario("stays in range", sc => sc
    .wait("200ms")
    .expectStream("wet", ys => ys.every(y => y >= -2048 && y <= 2047), { last: 4800 }));
`},{id:"F-09",title:"Pipelines",group:"Components",about:'RGB to luma in three stages. What a stage writes is visible to the stages after it, and pipeline.registers carries only what is still live: $.r, $.g and $.b cross one register, px crosses none. When the output is not ready the pipe stalls; .stall("skid") spends a few registers to keep that stall off the critical path.',shows:["pipeline()",".stage()","inferred pipeline registers","fixed-point weights from build-time JS","a JS model"],watch:"DAG (stages) \xB7 Waves",tries:["Add a contrast stage between sum and round",'Switch to .stall("global") and compare fmax'],file:"F-09-pipelines.js",text:`/** F-09 Pipelines
 *  group  Components
 *  about  RGB to luma in three stages. What a stage writes is visible to the stages after it, and
 *         pipeline.registers carries only what is still live: $.r, $.g and $.b cross one register, px crosses none.
 *         When the output is not ready the pipe stalls; .stall("skid") spends a few registers to keep that stall
 *         off the critical path.
 *  shows  pipeline() \xB7 .stage() \xB7 inferred pipeline registers \xB7 fixed-point weights from build-time JS \xB7 a JS model
 *  watch  DAG (stages) \xB7 Waves
 *  try    Add a contrast stage between sum and round | Switch to .stall("global") and compare fmax
 */
const rgb = struct({ r: u(8), g: u(8), b: u(8) });
const W = [0.299, 0.587, 0.114].map(w => Math.round(w * 256));   // [77, 150, 29] in Q0.8, computed now

const luma = pipeline("luma")
  .needs("rgb").provides("gray")
  .lib({ W })
  .stall("skid")
  .stage("weigh", ($, px) => {                      // the first stage receives the beat
    $.r = px.r * W[0];
    $.g = px.g * W[1];
    $.b = px.b * W[2];
  })
  .stage("sum", $ => { $.y = $.r + $.g + $.b; })    // as wide as it needs to be
  .stage("round", $ => sat(($.y + 128) >> 8, u(8)));   // the last stage's return value is the output beat

return design("luma")
  .board("dev")
  .use(stream("rgb").of(rgb), stream("gray").of(u(8)), luma)
  .scenario("matches the JS model", async tb => {   // runtime lambda: async JS beside the simulator
    const px = Array.from({ length: 64 }, () =>
      ({ r: tb.random.int(0, 255), g: tb.random.int(0, 255), b: tb.random.int(0, 255) }));
    await tb.push("rgb", px);
    const ys = await tb.pull("gray", px.length);
    px.forEach((p, i) =>
      tb.expectEqual(ys[i], Math.min(255, (p.r * W[0] + p.g * W[1] + p.b * W[2] + 128) >> 8), \`pixel \${i}\`));
  })
  .scenario("survives backpressure", sc => sc
    .feed("rgb", "random", { beats: 500 })
    .throttle("gray", { ready: 0.3 })               // the sink is ready on 30 % of cycles
    .expectStream("gray", ys => ys.length === 500, { within: "100us" }));
`},{id:"F-10",title:"Clock domains",group:"Time",about:"A sprite bounces in the 100 MHz system domain and is drawn in a 25.175 MHz pixel domain from a PLL. The position crosses between them on a stream marked .cross(). Delete that line and checks.cdc refuses to build, naming both domains and the stream.",shows:[".clocks()",".domain()","stream().cross()","std.video","unsigned minus unsigned is signed"],watch:"Board (HDMI) \xB7 DAG (one graph per domain)",tries:["Remove .cross() and read the diagnostic","Move the sprite once per frame instead of on a timer"],file:"F-10-clock-domains.js",text:`/** F-10 Clock domains
 *  group  Time
 *  about  A sprite bounces in the 100 MHz system domain and is drawn in a 25.175 MHz pixel domain from a PLL. The
 *         position crosses between them on a stream marked .cross(). Delete that line and checks.cdc refuses to
 *         build, naming both domains and the stream.
 *  shows  .clocks() \xB7 .domain() \xB7 stream().cross() \xB7 std.video \xB7 unsigned minus unsigned is signed
 *  watch  Board (HDMI) \xB7 DAG (one graph per domain)
 *  try    Remove .cross() and read the diagnostic | Move the sprite once per frame instead of on a timer
 */
const position = stream("sprite.pos")
  .of(struct({ x: u(10), y: u(10) }))
  .buffer(1, { overflow: "latest" })                // only the newest position matters\u2026
  .cross({ from: "sys", to: "pix" });               // \u2026so the crossing is a handshake synchronizer, not a FIFO

const physics = module("physics")
  .provides("sprite.pos")
  .lib({ MAX_X: 640 - 16, MAX_Y: 480 - 16 })
  .regs({ x: u(10).init(40), y: u(10).init(30), left: bit, up: bit })
  .every("8ms", $ => {
    const left = $.x === 0 ? 0 : $.x === MAX_X ? 1 : $.left;
    const up = $.y === 0 ? 0 : $.y === MAX_Y ? 1 : $.up;
    $.left = left;
    $.up = up;
    if (left) $.x -= 1; else $.x += 1;
    if (up) $.y -= 1; else $.y += 1;
    $.push("sprite.pos", { x: $.x, y: $.y });
  });

const raster = module("raster")
  .domain("pix")
  .needs("sprite.pos", "beam")                      // beam: { x, y, visible } from std.video.timing
  .provides("pixels")
  .regs({ sx: u(10), sy: u(10) })
  .on("sprite.pos", ($, p) => { $.sx = p.x; $.sy = p.y; })
  .on("beam", ($, b) => {
    const dx = b.x - $.sx, dy = b.y - $.sy;         // u10 \u2212 u10 is s11: left of the sprite stays negative
    const inside = dx >= 0 && dx < 16 && dy >= 0 && dy < 16;
    $.push("pixels", inside ? { r: 255, g: 200, b: 0 } : { r: 0, g: 0, b: b.y.bits(8, 1) });
  });

return design("bounce")
  .board("dev")
  .clocks(c => c
    .pin("sys", "clk")                              // 100 MHz from the board
    .pll("pix", { from: "sys", hz: "25.175 MHz", tolerance: "0.5%" }))   // the compiler solves the dividers
  .use(position, physics, raster)
  .use(
    std.video.timing("beam").mode("640x480@60").domain("pix"),
    std.video.hdmi("hdmi").domain("pix").bind({ tmds: "hdmi" }))    // asks .clocks() for pix \xD7 5 by itself
  .scenario("draws a 16 \xD7 16 sprite", sc => sc
    .wait("40ms")
    .expectFrame("hdmi", f => f.count({ r: 255, g: 200, b: 0 }) === 256))
  .scenario("bounces off the right edge", sc => sc
    .poke("physics.x", 620).wait("50ms")
    .expectState("physics", s => s.left === 1));
`},{id:"F-11",title:"Proofs and testbenches",group:"Verification",about:"A round-robin arbiter with its properties beside it. The same .assert() lambdas are checked on every cycle in simulation, proved by the formal engine, and can be built into hardware as monitors. A seeded, scoreboarded random test runs as an async runtime lambda.",shows:[".require() on params",".assert() / .assume() / .cover()","past() and within()",".prove()","coverage"],watch:"Proofs \xB7 Waves",tries:["Break the rotation and read the counterexample trace","Prove it for N = 8"],file:"F-11-proofs.js",text:`/** F-11 Proofs and testbenches
 *  group  Verification
 *  about  A round-robin arbiter with its properties beside it. The same .assert() lambdas are checked on every
 *         cycle in simulation, proved by the formal engine, and can be built into hardware as monitors. A seeded,
 *         scoreboarded random test runs as an async runtime lambda.
 *  shows  .require() on params \xB7 .assert() / .assume() / .cover() \xB7 past() and within() \xB7 .prove() \xB7 coverage
 *  watch  Proofs \xB7 Waves
 *  try    Break the rotation and read the counterexample trace | Prove it for N = 8
 */
const arbiter = module("arbiter")
  .params({ N: 4 })
  .require(({ N }) => (N & (N - 1)) === 0 || "N must be a power of two")   // checked per specialization
  .in("req", ({ N }) => u(N))
  .out("grant", ({ N }) => u(N))
  .regs(({ N }) => ({ last: u(clog2(N)) }))
  .comb($ => {
    $.grant = 0;
    for (let k = N; k >= 1; k--) {                  // unrolled; the last match wins, so walk from the far end
      const i = wrap($.last + k, u(clog2(N)));      // wrapping to clog2(N) bits is modulo N for free
      if ($.req[i]) $.grant = 1 << i;
    }
  })
  .seq($ => { for (let i = 0; i < N; i++) if ($.grant[i]) $.last = i; })
  .assume("a request waits for its grant", $ => !(past($.req[0]) && !past($.grant[0])) || $.req[0])
  .assert("at most one grant", $ => ($.grant & ($.grant - 1)) === 0)
  .assert("grants go to requesters", $ => ($.grant & ~$.req) === 0)
  .assert("served within N cycles", $ => !$.req[0] || within(N, $.grant[0]))
  .cover("every port served in turn", $ => sequence($.grant === 1, $.grant === 2, $.grant === 4, $.grant === 8));

return design("arbiter")
  .use(arbiter)                                     // no board and no part: simulation and proofs only
  .prove(p => p
    .module("arbiter")
    .bmc(24)                                        // no counterexample in 24 cycles\u2026
    .induction()                                    // \u2026then k-induction for every depth
    .engine("smt"))
  .scenario("fair under random load", async tb => {
    const served = [0, 0, 0, 0];
    let req = 0, grant = 0;
    for (let t = 0; t < 10_000; t++) {
      req = (req & ~grant) | tb.random.int(0, 15);  // pending requests stay up, as the assume demands
      await tb.poke("arbiter.req", req);
      await tb.step();
      grant = await tb.peek("arbiter.grant");
      if (grant) served[Math.log2(grant)]++;
    }
    tb.expect(Math.min(...served) > 2000, \`shares: \${served}\`);   // seeded: a failure replays exactly
    tb.expectCoverage("all");                       // every .cover() was hit at least once
  });
`},{id:"F-12",title:"Knobs",group:"Runtime",about:"Modules declare what may be turned while the design runs. csr.collect gathers every knob, status and irq into one register map behind a bus bridge, and the backends emit a C header, a typed JS driver and the register docs. The host panel is a runtime lambda that turns knobs over UART; the bitstream never changes.",shows:[".knob() with bounds enforced in hardware",".status()",".irq()","a bus bridge","host()","emitted drivers"],watch:"Board (audio) \xB7 Registers",tries:["Give the panel a vibrato-depth knob","Raise the volume ceiling and hear the clip counter climb"],file:"F-12-knobs.js",text:`/** F-12 Knobs
 *  group  Runtime
 *  about  Modules declare what may be turned while the design runs. csr.collect gathers every knob, status and irq
 *         into one register map behind a bus bridge, and the backends emit a C header, a typed JS driver and the
 *         register docs. The host panel is a runtime lambda that turns knobs over UART; the bitstream never changes.
 *  shows  .knob() with bounds enforced in hardware \xB7 .status() \xB7 .irq() \xB7 a bus bridge \xB7 host() \xB7 emitted drivers
 *  watch  Board (audio) \xB7 Registers
 *  try    Give the panel a vibrato-depth knob | Raise the volume ceiling and hear the clip counter climb
 */
const sine = rom("sine")
  .of(s(12))
  .from(1024, i => Math.round(2047 * Math.sin((2 * Math.PI * i) / 1024)));

const synth = module("synth")
  .provides("samples")
  .knob("hz", u(14), { reset: 440, min: 20, max: 8000 })   // a write outside the bounds saturates, in hardware
  .knob("volume", u(4), { reset: 8 })
  .status("clipped", u(16))                         // hardware writes it, the host reads it
  .irq("clip")                                      // a pulse here arrives at the host as an event
  .lib({ SINE: sine, K: Math.round(2 ** 32 / 48_000) })
  .regs({ phase: u(32) })
  .every("48 kHz", $ => {
    $.phase += $.hz * K;
    const y = (SINE[$.phase.bits(31, 22)] * $.volume) >> 3;
    if (y > 2047 || y < -2048) { $.clipped += 1; $.clip = 1; }
    $.push("samples", sat(y, s(12)));
  });

const panel = host("panel")
  .over("bridge")                                   // the bridge's other end: a serial port, or the simulator
  .onStart(async dev => dev.log(await dev.registers()))   // the map the compiler built
  .every("20ms", async dev => {                     // runtime lambda: ordinary JS on your machine
    const t = dev.clock.seconds();
    await dev.knob("synth.hz").set(Math.round(660 + 220 * Math.sin(Math.PI * t)));   // a siren, no rebuild
  })
  .on("synth.clip", async dev => {
    await dev.knob("synth.volume").update(v => Math.max(v - 1, 0));
    dev.log("clipped", await dev.status("synth.clipped").read(), "times; volume down");
  });

return design("siren")
  .board("dev")
  .use(synth, panel)
  .use(
    std.sigmaDelta("dac").needs("samples").bind({ out: "audio" }),
    std.bridge.uart("bridge").baud(1_000_000).bind({ uart: "uart" }))   // how the host reaches the map
  .compile(c => c
    .emit("c-header", { to: "fw/siren_regs.h" })
    .emit("host-js", { to: "host/siren.js" })      // dev.knob("synth.hz"), typed, with bounds and docs
    .emit("register-doc", { to: "docs/registers.md" }))
  .scenario("bounds hold in hardware", sc => sc
    .write("synth.hz", 50_000).expectKnob("synth.hz", 8000)
    .write("synth.hz", 3).expectKnob("synth.hz", 20))
  .scenario("the panel turns the volume down on clipping", sc => sc
    .write("synth.volume", 15)
    .run("panel").wait("100ms")
    .expectKnob("synth.volume", v => v < 15));
`},{id:"F-13",title:"The pass pipeline",group:"Compiler",about:"Under every design is an IR DAG compiler. Hardware lambdas are parsed into HIR, flattened into one dataflow DAG per clock domain (registers are where the cycles are cut), optimized to a fixpoint, mapped onto the part's cells, then placed and routed. Every node keeps the lambda and the source text it came from, through every pass. This is what .compile() runs when you pass nothing, written out, with a snapshot, an inspection and checks between stages.",shows:["hir \u2192 dag \u2192 net \u2192 phys","stages and passes","fixpoint","verifyEach","snapshot","inspect","checks"],watch:"Passes \xB7 DAG \xB7 Report",tries:["Drop dsp.pack and compare LUTs","Ask for 400 MHz and follow explain() back to the source"],file:"F-13-pass-pipeline.js",text:`/** F-13 The pass pipeline
 *  group  Compiler
 *  about  Under every design is an IR DAG compiler. Hardware lambdas are parsed into HIR, flattened into one
 *         dataflow DAG per clock domain (registers are where the cycles are cut), optimized to a fixpoint, mapped
 *         onto the part's cells, then placed and routed. Every node keeps the lambda and the source text it came
 *         from, through every pass. This is what .compile() runs when you pass nothing, written out, with a
 *         snapshot, an inspection and checks between stages.
 *  shows  hir \u2192 dag \u2192 net \u2192 phys \xB7 stages and passes \xB7 fixpoint \xB7 verifyEach \xB7 snapshot \xB7 inspect \xB7 checks
 *  watch  Passes \xB7 DAG \xB7 Report
 *  try    Drop dsp.pack and compare LUTs | Ask for 400 MHz and follow explain() back to the source
 */
const mac = module("mac")
  .in({ a: s(18), b: s(18), clear: bit })
  .out("acc", s(48))
  .seq($ => {
    if ($.clear) $.acc = 0;
    else $.acc += $.a * $.b;                        // 18 \xD7 18 \u2192 36 bits; dsp.pack folds the multiply-add into one DSP
  });

// What .inspect("dag", g => g.print(), { after: "optimize" }) shows: one line per node, each with its origin:
//   %1 = in a : s18
//   %2 = in b : s18
//   %3 = in clear : bit
//   %4 = reg acc : s48                       \u2190 .out("acc", s(48)), written in .seq
//   %5 = mul %1, %2 : s36                    \u2190 $.a * $.b
//   %6 = add %4, sext(%5) : s48 wrap         \u2190 +=
//   %7 = mux %3, 0, %6 : s48                 \u2190 if ($.clear)
//   %4.next = %7

return design("mac")
  .part("xc7a35t-1")                                // no board: an IP block, and its ports are the top
  .clocks(c => c.port("sys", { hz: "250 MHz" }))
  .use(mac)
  .compile(c => c
    .cache(".weft/cache")                           // nodes are content-hashed: an edit rebuilds only what it reaches
    .stage("front", s => s                          // source \u2192 hir
      .pass(std.passes.parse)                       // hardware lambdas \u2192 HIR, with the capture check
      .pass(std.passes.elaborate)                   // params, .with(), generator loops \u2192 one instance tree
      .pass(std.passes.link))                       // provides/needs and .wire() \u2192 edges; unmet needs fail here
    .stage("lower", s => s                          // hir \u2192 dag
      .pass(std.passes.fsm.extract, std.passes.pipeline.registers, std.passes.stream.lower, std.passes.csr.collect)
      .pass(std.passes.flatten)                     // one DAG per clock domain; registers are its sources and sinks
      .pass(std.passes.widths)                      // infer, then enforce: nothing truncates silently
      .pass(std.passes.checks.loops, std.passes.checks.latches, std.passes.checks.cdc))
    .stage("optimize", s => s
      .pass(std.passes.constFold, std.passes.cse, std.passes.muxTree, std.passes.dce)
      .fixpoint({ max: 8 }))                        // repeat until the graph's hash stops changing
    .stage("time", s => s                           // moves latency only where .pipelined() allows it
      .pass(std.passes.pipeline.cut, std.passes.retime))
    .stage("map", s => s                            // dag \u2192 net
      .pass(std.passes.mem.infer, std.passes.dsp.pack, std.passes.fsm.encode)
      .pass(std.passes.techmap))                    // the part decides the cells: LUT6, CARRY4, DSP48E1 \u2026
    .stage("back", s => s                           // net \u2192 phys
      .pass(std.passes.place.with({ effort: "high" }), std.passes.route, std.passes.timing))
    .verifyEach()                                   // re-check IR invariants after every pass: slower, catches pass bugs
    .snapshot("dag", { after: "optimize", as: "dot", to: "build/mac.dag.dot" })
    .inspect("net", net => console.log(net.stats()), { after: "map" })   // a builder lambda over the IR, mid-build
    .check("one DSP", r => r.resources.dsps === 1 || \`used \${r.resources.dsps} DSPs\`)
    .check("meets 250 MHz", r => r.timing.slack("sys") >= 0 || r.timing.worst("sys").explain())   // path \u2192 source
    .emit("verilog", { to: "build/rtl" })
    .emit("report", { to: "build/mac.report.json" }))
  .scenario("accumulates", sc => sc
    .poke("mac.a", 3).poke("mac.b", -4).step(5)
    .expectSignal("mac.acc", -60));
`},{id:"F-14",title:"Your own passes",group:"Compiler",about:"Passes are values, like modules. An analysis computes a fact about the IR; a pass changes it; a rewrite is a pattern and its replacement, both written as hardware lambdas and matched against the DAG. requires/preserves turn the pass list into a DAG of its own, so an analysis reruns only after something invalidated it. The same scenario runs at three IR levels; a mismatch names the pass that caused it.",shows:["analysis()","pass().visit()","rewrite().from().where().to()","rule examples","e-graph saturation","lint"],watch:"Passes \xB7 DAG",tries:["Add a rule for x * 2^k - x","Lower the fanout limit to 8 and watch the register count"],file:"F-14-own-passes.js",text:`/** F-14 Your own passes
 *  group  Compiler
 *  about  Passes are values, like modules. An analysis computes a fact about the IR; a pass changes it; a rewrite
 *         is a pattern and its replacement, both written as hardware lambdas and matched against the DAG.
 *         requires/preserves turn the pass list into a DAG of its own, so an analysis reruns only after something
 *         invalidated it. The same scenario runs at three IR levels; a mismatch names the pass that caused it.
 *  shows  analysis() \xB7 pass().visit() \xB7 rewrite().from().where().to() \xB7 rule examples \xB7 e-graph saturation \xB7 lint
 *  watch  Passes \xB7 DAG
 *  try    Add a rule for x * 2^k - x | Lower the fanout limit to 8 and watch the register count
 */
const isPow2 = k => k > 0 && (k & (k - 1)) === 0;

const peephole = [
  rewrite("multiply by a power of two")
    .from((x, k) => x * k)                          // a pattern: x and k match any node\u2026
    .where(({ k }) => k.isConst && isPow2(k.value)) // \u2026and this builder lambda narrows the match
    .to((x, k) => x << clog2(k))
    .examples([[x => x * 8, x => x << 3], [x => x * 6, null]]),   // null: must not match
  rewrite("same value on both arms").from((c, a) => (c ? a : a)).to((c, a) => a),
  rewrite("double inversion").from(x => ~~x).to(x => x),
];   // SAT screens each rule at widths 1\u201316 when loaded, then proves it again at the exact width of each match

const fanout = analysis("fanout")
  .on("dag")
  .run(g => new Map(g.nodes().map(n => [n.id, n.users.length])));

const splitFanout = pass("split-fanout")
  .on("dag")
  .requires(fanout, std.analyses.timing)            // estimated on the DAG, long before placement
  .preserves("widths", "domains")                   // everything else is invalidated when this pass edits the graph
  .params({ limit: 32 })
  .visit("reg", (n, g, { fanout, timing, limit }) => {
    const users = fanout.get(n.id);
    if (users > limit && timing.slack(n) < 0.5) g.duplicate(n, { copies: Math.ceil(users / limit), split: "users" });
  });

const wideCompares = pass("lint: wide comparisons")
  .on("dag")
  .readonly()                                       // preserves every analysis
  .visit(["lt", "le", "gt", "ge"], (n, g) => {
    const w = Math.max(...n.args.map(a => a.width));   // the result is one bit; the operands carry the width
    if (w > 32) g.warn(n, \`\${w}-bit comparison in one cycle\`);   // reported at the lambda's source line
  });

const scaler = module("scaler")
  .in({ x: u(16), en: bit, now: u(48), deadline: u(48) })
  .out({ y: vec(u(20), 64), late: bit })
  .regs({ go: bit })                                // en, registered once: one flip-flop that drives 1280 enables
  .seq($ => {
    $.go = $.en;
    for (let i = 0; i < 64; i++) if ($.go) $.y[i] = ($.x ^ i) * 8;   // 64 multiplies by 8
  })
  .comb($ => { $.late = $.now > $.deadline; });    // 48 bits: the lint will say so

return design("passes")
  .part("ice40up5k-sg48")
  .clocks(c => c.port("sys", { hz: "48 MHz" }))
  .use(scaler)
  .compile(c => c
    .use(std.pipeline.default)                      // F-13's stages, then edits to them
    .after("lower", s => s.pass(wideCompares))
    .after("optimize", s => s.pass(std.passes.saturate(peephole, { iters: 6, cost: "luts" })))   // e-graph, cheapest wins
    .before("techmap", s => s.pass(splitFanout.with({ limit: 16 })))
    .explainPlan()                                  // prints the pass DAG: what ran, what was reused, what was invalidated
    .check("no multipliers left", r => r.ir("dag").count("mul") === 0))
  .scenario("same answers after the rewrites", sc => sc
    .poke("scaler.x", 1000).poke("scaler.en", 1).step(2)   // one edge to register en, one to load y
    .expectSignal("scaler.y[5]", (1000 ^ 5) * 8),
    { levels: ["hir", "dag", "net"] });             // run at three IR levels; a mismatch is bisected to one pass
`},{id:"F-15",title:"Retiming and exploration",group:"Compiler",about:"A 31-tap FIR filter written as one combinational sum. .pipelined() hands the latency of its stream path to the compiler, so pipeline.cut slices the adder tree to meet the clock and retime moves registers across it. .explore() runs the pipeline over a grid of build-time knobs and keeps the Pareto front; the IR cache makes every point after the first a partial rebuild. Build-time knobs pick parameters; runtime knobs (F-12) are registers.",shows:["taps from build-time JS",".hint()",".pipelined()","pipeline.cut","retime","explore()","a JS reference model"],watch:"Report (explore) \xB7 DAG",tries:['Add a "fold symmetric taps" knob',"Keep only points with latency \u2264 6 and see which survive"],file:"F-15-retime-explore.js",text:`/** F-15 Retiming and exploration
 *  group  Compiler
 *  about  A 31-tap FIR filter written as one combinational sum. .pipelined() hands the latency of its stream path to
 *         the compiler, so pipeline.cut slices the adder tree to meet the clock and retime moves registers across
 *         it. .explore() runs the pipeline over a grid of build-time knobs and keeps the Pareto front; the IR cache
 *         makes every point after the first a partial rebuild. Build-time knobs pick parameters; runtime knobs
 *         (F-12) are registers.
 *  shows  taps from build-time JS \xB7 .hint() \xB7 .pipelined() \xB7 pipeline.cut \xB7 retime \xB7 explore() \xB7 a JS reference model
 *  watch  Report (explore) \xB7 DAG
 *  try    Add a "fold symmetric taps" knob | Keep only points with latency \u2264 6 and see which survive
 */
function lowpass(n, cutoff) {                       // windowed sinc, normalized to unity gain in Q15: plain JS
  const m = (n - 1) / 2;
  const h = Array.from({ length: n }, (_, i) => {
    const t = i - m;
    const sinc = t === 0 ? 2 * cutoff : Math.sin(2 * Math.PI * cutoff * t) / (Math.PI * t);
    return sinc * (0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (n - 1)));   // Hamming window
  });
  const sum = h.reduce((a, b) => a + b, 0);
  return h.map(v => Math.round((v / sum) * 2 ** 15));
}

const fir = module("fir")
  .params({ TAPS: 31, CUTOFF: 0.1, MULT: "dsp" })
  .needs("in").provides("out")
  .lib(({ TAPS, CUTOFF }) => ({ H: lowpass(TAPS, CUTOFF) }))
  .regs(({ TAPS }) => ({ z: vec(s(16), TAPS) }))   // the delay line
  .hint(({ MULT }) => ({ multiply: MULT }))         // "dsp" | "lut" | "shift-add": steers dsp.pack and techmap
  .pipelined({ path: ["in", "out"] })               // latency on this stream path is the compiler's to choose
  .on("in", ($, x) => {
    for (let i = TAPS - 1; i > 0; i--) $.z[i] = $.z[i - 1];
    $.z[0] = x;
    let acc = x * H[0];
    for (let i = 1; i < TAPS; i++) acc = acc + $.z[i - 1] * H[i];   // grows as it must; nothing truncates
    $.push("out", sat(acc >> 15, s(16)));
  });

return design("fir")
  .board("dev")
  .use(stream("in").of(s(16)), stream("out").of(s(16)), fir)
  .compile(c => c
    .use(std.pipeline.default)                      // F-13's stages, then one edit to them
    .replace("retime", std.passes.retime.with({ moves: "both" }))   // registers may move backward too
    .explore(x => x
      .knob("fir.TAPS", [15, 31, 63])
      .knob("fir.MULT", ["dsp", "lut", "shift-add"])
      .knob("clock.sys", ["100 MHz", "150 MHz", "200 MHz"])
      .measure(r => ({
        luts: r.resources.luts,
        dsps: r.resources.dsps,
        latency: r.latency("fir"),
        met: r.timing.slack("sys") >= 0,
      }))
      .keep(m => m.met)
      .pareto(["luts", "dsps", "latency"])
      .parallel(8)
      .report("build/fir-explore.html")))
  .scenario("matches the JS model", async tb => {
    const H = lowpass(31, 0.1);                     // runtime lambdas may call build-time JS freely
    const xs = Array.from({ length: 200 }, () => tb.random.int(-20_000, 20_000));
    await tb.push("in", xs);
    const ys = await tb.pull("out", xs.length);
    xs.forEach((_, n) => {
      const acc = H.reduce((a, h, i) => a + h * (xs[n - i] ?? 0), 0);
      tb.expectEqual(ys[n], Math.max(-32_768, Math.min(32_767, Math.floor(acc / 2 ** 15))), \`y[\${n}]\`);
    });
  });
`},{id:"F-16",title:"Many parts, many backends",group:"Compiler",about:"The DAG knows nothing about the part until techmap, so boards with the same clock share every pass before it: dev and big (100 MHz) share one DAG, and pico (12 MHz) gets its own, because the UART dividers are computed from the clock. It emits Verilog and VHDL per part, a cycle-accurate WebAssembly model per DAG, and a cell census from a backend of your own. One scenario runs behaviorally and gate-level on every part.",shows:[".boards()","board().part()","c.when() per target","emit()","backend()","scenarios across IR levels"],watch:"Report (per target) \xB7 Passes",tries:["Emit FIRRTL as well","Give the pico build a 32 KB line buffer in SPRAM"],file:"F-16-targets.js",text:`/** F-16 Many parts, many backends
 *  group  Compiler
 *  about  The DAG knows nothing about the part until techmap, so boards with the same clock share every pass before
 *         it: dev and big (100 MHz) share one DAG, and pico (12 MHz) gets its own, because the UART dividers are
 *         computed from the clock. It emits Verilog and VHDL per part, a cycle-accurate WebAssembly model per DAG,
 *         and a cell census from a backend of your own. One scenario runs behaviorally and gate-level on every part.
 *  shows  .boards() \xB7 board().part() \xB7 c.when() per target \xB7 emit() \xB7 backend() \xB7 scenarios across IR levels
 *  watch  Report (per target) \xB7 Passes
 *  try    Emit FIRRTL as well | Give the pico build a 32 KB line buffer in SPRAM
 */
const upcase = module("upcase")
  .needs("rx.bytes").provides("tx.bytes")
  .on("rx.bytes", ($, c) => {
    $.push("tx.bytes", c >= 97 && c <= 122 ? c ^ 0x20 : c);   // flip bit 5: a \u2192 A
  });

const census = backend("cell-census")
  .on("net")                                        // after techmap, once per target
  .emit((net, out) => {
    const counts = {};
    for (const cell of net.cells()) counts[cell.type] = (counts[cell.type] ?? 0) + 1;
    out.file("cells.json", JSON.stringify(counts, null, 2));
  });

return design("shout")
  .boards({
    pico: board("pico"),                            // ice40up5k
    dev: board("dev"),                              // xc7a35t
    big: board("dev").part("xc7a100t-1csg324"),     // a board profile is a copy you can change
  })
  .use(
    std.uart.rx("rx").baud(115_200).bind({ rx: "uart.rx" }).provides("rx.bytes"),
    upcase,
    std.uart.tx("tx").baud(115_200).bind({ tx: "uart.tx" }).needs("tx.bytes"))
  .compile(c => c
    .when(t => t.family === "xc7", w => w.after("map", s => s.pass(std.passes.srl.infer)))   // LUTs as shift registers
    .emit("verilog", { to: t => \`build/\${t.name}/rtl\` })   // a builder lambda, once per target
    .emit("vhdl", { to: t => \`build/\${t.name}/vhdl\` })
    .emit("sim:wasm", { to: t => \`build/\${t.name}/shout.wasm\`, level: "dag" })   // one model per distinct DAG
    .emit(census, { to: t => \`build/\${t.name}\` })
    .check("small everywhere", (r, t) => r.resources.luts < 0.2 * t.part.luts))
  .scenario("shouts back", sc => sc
    .uart("uart", "hello, fabric\\n")
    .expectUart("uart", "HELLO, FABRIC\\n", { within: "3ms" }),
    { levels: ["dag", "net"], targets: "all" });    // two DAG runs (pico; dev and big), three net runs
`},{id:"F-17",title:"Hot swap, with rollback",group:"Live change",about:"The filter lives in a reconfigurable region. A change is linted, replayed against recorded traffic, built as a partial bitstream for that region alone (the rest of the design is locked), and loaded for a canary window while its asserts run as hardware monitors. A knob-only change is a register write and skips all of that. A good swap commits; a bad one trips an assert during canary and the previous partial comes back.",shows:[".regions()",".place()","change()",".knob()",".replace()",".patch()",".verify()",".deploy()",".migrate()"],watch:"Changes \xB7 Board (audio) \xB7 Waves",tries:["Shorten the canary to 50 ms and watch the bad change commit","Patch the filter and a knob in one change"],file:"F-17-hot-swap.js",text:`/** F-17 Hot swap, with rollback
 *  group  Live change
 *  about  The filter lives in a reconfigurable region. A change is linted, replayed against recorded traffic, built
 *         as a partial bitstream for that region alone (the rest of the design is locked), and loaded for a canary
 *         window while its asserts run as hardware monitors. A knob-only change is a register write and skips all
 *         of that. A good swap commits; a bad one trips an assert during canary and the previous partial comes back.
 *  shows  .regions() \xB7 .place() \xB7 change() \xB7 .knob() \xB7 .replace() \xB7 .patch() \xB7 .verify() \xB7 .deploy() \xB7 .migrate()
 *  watch  Changes \xB7 Board (audio) \xB7 Waves
 *  try    Shorten the canary to 50 ms and watch the bad change commit | Patch the filter and a knob in one change
 */
function lowpass2(fc, fs) {                         // an RBJ biquad low-pass in Q14, plain JS at build time
  const w = (2 * Math.PI * fc) / fs, alpha = Math.sin(w) / Math.SQRT2, c = Math.cos(w), a0 = 1 + alpha;
  const q14 = v => Math.round((v / a0) * 2 ** 14);
  return { B: [q14((1 - c) / 2), q14(1 - c), q14((1 - c) / 2)], A: [q14(-2 * c), q14(1 - alpha)] };
}

const tone = module("tone")
  .provides("dry")
  .knob("volume", u(4), { reset: 2 })
  .lib({ STEP: Math.round((330 * 2 ** 16) / 48_000) })
  .regs({ phase: u(16) })
  .every("48 kHz", $ => {
    $.phase += STEP;
    $.push("dry", sat(($.phase.as(s(16)) * $.volume) >> 4, s(16)));   // .as() reinterprets: a sawtooth
  });

const onePole = module("filter")
  .needs("dry").provides("wet")
  .knob("alpha", u(8), { reset: 32 })               // 0 holds still, 255 passes everything
  .regs({ y: s(16) })
  .on("dry", ($, x) => {

  })
  .assert("never pinned at a rail", $ => $.y !== 32767 && $.y !== -32768);   // sim, proofs, and a hardware monitor

const biquad = module("filter")                     // same name and ports: a drop-in replacement
  .needs("dry").provides("wet")
  .lib({ ...lowpass2(2000, 48_000), GAIN: 1 })
  .regs({ x1: s(16), x2: s(16), y1: s(16), y2: s(16), out: s(16) })
  .on("dry", ($, x) => {
    const acc = B[0] * x + B[1] * $.x1 + B[2] * $.x2 - A[0] * $.y1 - A[1] * $.y2;
    const y = sat(acc >> 14, s(16));
    $.x2 = $.x1; $.x1 = x;
    $.y2 = $.y1; $.y1 = y;
    const out = sat(y * GAIN, s(16));               // gain after the feedback loop, never inside it
    $.out = out;
    $.push("wet", out);

  .assert("never pinned at a rail", $ => $.out !== 32767 && $.out !== -32768)
  .migrate(old => ({ y1: old.y, y2: old.y, out: old.y }));   // runtime lambda: the old region's registers, read back

  .knob("filter.alpha", 12);                        // a register write: no bitstream, commits at once

  .deploy(d => d.partial("dsp").canary("300ms", { watch: ["asserts", "wet.rate"] }))
  .rollbackOn("assert", "stall");

const louder = change("gain \xD7 4")
  .patch("filter", { lib: { GAIN: 4 } })            // re-elaborates one module; only its region is rebuilt
  .verify(v => v.lint().replay("last 1s"))          // the recorded second was quiet, so replay passes
  .deploy(d => d.partial("dsp").canary("500ms"))
  .rollbackOn("assert");

return design("hot-swap")
  .board("dev")
  .regions(r => r.partition("dsp", { luts: 1500, dsps: 6 }))   // a floorplanned slot; everything else is static
  .place({ filter: "dsp" })
  .record({ streams: ["dry"], keep: "2s" })         // what .replay() feeds a candidate
  .use(tone, onePole, std.sigmaDelta("dac").needs("wet").bind({ out: "audio" }))
  .scenario("good commits, bad rolls back", sc => sc

    .apply(swap).expectChange(/biquad/, "committed", { within: "2s" })
    .expectState("filter", s => s.y1 !== 0)         // migrate() carried the state across
    .apply(louder).wait("100ms")

 *  group  Agents
 *  about  An agent takes part in the build. When timing fails, the compiler hands the closer a dossier: the
 *         critical path as DAG nodes, each carrying the lambda and source text it came from. The closer proposes a
 *         change; the change is linted, checked for equivalence and timed again before it waits for your approval.
 *  shows  agent() \xB7 .scope() \xB7 the timing dossier \xB7 provenance through passes \xB7 equivalence up to stream latency
 *  watch  Agent \xB7 Changes \xB7 Report (timing)
 *  try    Let it commit knob changes without approval | Limit it to one proposal per build
 */
const closer = agent("closer")
  .model("claude")
  .guidelines(\`You close timing on FPGA designs. Read the dossier's critical path and the source it came from.
Prefer, in order: a knob within its bounds, latency on a stream path (.pipelined), a rewrite of the lambda.
Never change ports, pins, clocks or stream types. Behavior must stay equivalent up to stream latency.\`)
  .scope(s => s.read("*").propose("modules/*", "knobs/*").never("pins", "clocks", "boot", "streams"))
  .budget({ proposals: 3, per: "build" })
  .on("timing.failed", async (ctx, d) => {          // d: { domain, target, slack, path: [{ op, width, origin }], resources }
    const proposal = await ctx.llm.propose({
      goal: \`Meet \${d.target} in \${d.domain}; the worst slack is \${d.slack} ns\`,
      evidence: { path: d.path, resources: d.resources },
    });
    return ctx.changes.submit(proposal, {
      verify: v => v.lint().equiv({ upTo: "stream latency" }).timing(),
      approve: "you",                               // waits in the Changes tab
    });
  });

const blend = module("blend")
  .needs("layers").provides("out")
  .lib({ GAMMA: Array.from({ length: 256 }, (_, i) => Math.round(255 * (i / 255) ** (1 / 2.2))) })
  .on("layers", ($, l) => {
    const mix = (l.fg * l.alpha + l.bg * (255 - l.alpha) + 128) >> 8;   // two multiplies, two adds\u2026
    $.push("out", GAMMA[sat(mix, u(8))]);                                 // \u2026and a table, all in one cycle
  });

return design("blend")
  .board("dev")
  .clocks(c => c.pin("sys", "clk").pll("fast", { from: "sys", hz: "300 MHz" }))
  .use(stream("layers").of(struct({ fg: u(8), bg: u(8), alpha: u(8) })), stream("out").of(u(8)))
  .use(blend.domain("fast"), closer)                // .domain() returns a new value, like every builder call
  .scenario("closes timing", sc => sc
    .build()
    .expectBuild("timing", "failed")                // the dossier goes to the closer
    .expectProposal("closer", { within: "2m" })
    .approve()
    .expectChange(/blend/, "committed")
    .expectBuild("timing", "met"))
  .scenario("still blends", sc => sc
    .feed("layers", [{ fg: 255, bg: 0, alpha: 255 }, { fg: 0, bg: 255, alpha: 0 }])
    .expectStream("out", ys => ys.every(y => y >= 254)));
`},{id:"F-19",title:"Arcade",group:"Whole designs",about:"Two-player pong on the studio board: buttons in, HDMI and audio out. The game is an fsm stepped once per frame; the picture is drawn in the pixel domain; knobs, a status counter and an irq reach a host panel over UART. Reset groups supervise like process trees, the boot order waits for the PLL, the renderer sits in a reconfigurable slot, and a mechanic is on call when the pixel path keeps falling over.",shows:["everything at once","fsm().step()","two crossings","groups as reset trees",".boot()","probes in a dossier"],watch:"Board \xB7 DAG \xB7 Changes \xB7 Agent",tries:["Hang the encoder four times and approve the mechanic's fix","Add a third palette as a change"],file:"F-19-arcade.js",text:`/** F-19 Arcade
 *  group  Whole designs
 *  about  Two-player pong on the studio board: buttons in, HDMI and audio out. The game is an fsm stepped once per
 *         frame; the picture is drawn in the pixel domain; knobs, a status counter and an irq reach a host panel
 *         over UART. Reset groups supervise like process trees, the boot order waits for the PLL, the renderer
 *         sits in a reconfigurable slot, and a mechanic is on call when the pixel path keeps falling over.
 *  shows  everything at once \xB7 fsm().step() \xB7 two crossings \xB7 groups as reset trees \xB7 .boot() \xB7 probes in a dossier
 *  watch  Board \xB7 DAG \xB7 Changes \xB7 Agent
 *  try    Hang the encoder four times and approve the mechanic's fix | Add a third palette as a change
 */
const scene = struct({ bx: u(10), by: u(9), p1: u(9), p2: u(9), size: u(7), s1: u(4), s2: u(4) });

const FONT = ["111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001",
              "111100111001111", "111100111101111", "111001001001001", "111101111101111", "111101111001111"];
const glyphs = rom("glyphs").of(u(15)).from(10, d => parseInt(FONT[d], 2));   // 3 \xD7 5 digits, built from strings

const PALETTES = [
  { fg: { r: 240, g: 240, b: 230 }, bg: { r: 16, g: 24, b: 40 } },   // day
  { fg: { r: 255, g: 176, b: 0 }, bg: { r: 0, g: 0, b: 0 } },        // night
];

// ---------- streams: two of them cross clock domains ----------
const frames = stream("frame").of(bit).cross({ from: "pix", to: "sys" });   // one beat per frame start
const scenes = stream("scene").of(scene).buffer(1, { overflow: "latest" }).cross({ from: "sys", to: "pix" });
const sounds = stream("sfx").of(struct({ hz: u(10), ms: u(9) })).buffer(4, { overflow: "drop-oldest" });

// ---------- input ----------
const pads = std.debounce("pads")
  .bind({ raw: ["btn:up", "btn:down", "btn:a", "btn:b"] })
  .settle("5ms");                                   // .held: u(4), the debounced levels

// ---------- the game, in the system domain ----------
function movePaddles($) {                           // hardware helpers: shipped by .lib(), inlined where called
  const bottom = H - $.paddle;
  if ($.held[0] && $.p1 > 4) $.p1 -= 4;
  if ($.held[1] && $.p1 < bottom) $.p1 += 4;
  if ($.held[2] && $.p2 > 4) $.p2 -= 4;
  if ($.held[3] && $.p2 < bottom) $.p2 += 4;
}
function hits(y, top, size) {
  return y + BALL >= top && y <= top + size;
}

const game = fsm("game")
  .in("held", u(4))                                 // p1 up, p1 down, p2 up, p2 down
  .needs("frame").provides("scene", "sfx")
  .step("frame")                                    // states run once per frame, not once per clock
  .knob("speed", u(3), { reset: 2, min: 1, max: 6 })
  .knob("paddle", u(7), { reset: 64, min: 24, max: 120 })
  .status("rallies", u(16))
  .irq("point")
  .lib({ W: 640, H: 480, BALL: 8, movePaddles, hits })
  .regs({
    bx: u(10).init(316), by: u(9).init(236), vx: s(4), vy: s(4),
    p1: u(9).init(208), p2: u(9).init(208), s1: u(4), s2: u(4), wait: u(7),
  })
  .seq($ => {                                       // every clock, offer the newest scene; the crossing keeps one
    $.push("scene", { bx: $.bx, by: $.by, p1: $.p1, p2: $.p2, size: $.paddle, s1: $.s1, s2: $.s2 });
  })
  .initial("serve")
  .state("serve", $ => {
    $.bx = 316; $.by = 236; $.vy = 1;
    $.vx = $.s1 > $.s2 ? -$.speed : $.speed;        // serve toward whoever is ahead
    $.wait += 1;
    if ($.wait === 60) { $.wait = 0; return "play"; }   // a second of stillness
  })
  .state("play", $ => {
    movePaddles($);
    const x = $.bx + $.vx, y = $.by + $.vy;         // u10 + s4 is s12: off-screen stays honest
    if (y <= 0 || y >= H - BALL) { $.vy = $.vy > 0 ? -1 : 1; $.push("sfx", { hz: 220, ms: 30 }); }
    if (x <= 16 && hits(y, $.p1, $.paddle)) {
      $.vx = $.speed; $.rallies += 1; $.push("sfx", { hz: 440, ms: 40 });
    } else if (x >= W - 24 && hits(y, $.p2, $.paddle)) {
      $.vx = -$.speed; $.rallies += 1; $.push("sfx", { hz: 440, ms: 40 });
    } else if (x < 0 || x > W - BALL) {
      if (x < 0) $.s2 += 1; else $.s1 += 1;
      $.point = 1;
      $.push("sfx", { hz: 110, ms: 300 });
      return "point";
    }
    $.bx = sat(x, u(10));
    $.by = sat(y, u(9));
  })
  .state("point", $ => {
    $.wait += 1;
    if ($.s1 === 9 || $.s2 === 9) return "over";
    if ($.wait === 45) { $.wait = 0; return "serve"; }
  })
  .state("over", $ => {
    if ($.held !== 0) { $.s1 = 0; $.s2 = 0; $.wait = 0; return "serve"; }
  });

// ---------- the picture, in the pixel domain ----------
function box(px, py, x, y, w, h) {
  return px >= x && px < x + w && py >= y && py < y + h;
}
function digitAt(bx, by, x0, d) {                   // is the beam inside digit d, drawn 8\xD7 at (x0, 24)?
  const cx = (bx - x0) >> 3, cy = (by - 24) >> 3;
  return cx >= 0 && cx < 3 && cy >= 0 && cy < 5 && GLYPHS[d][14 - (cy * 3 + cx)];
}

const renderer = module("renderer")
  .domain("pix")
  .needs("beam", "scene").provides("pixels")
  .knob("palette", u(1))                            // a knob in another domain is synchronized for you
  .lib({ GLYPHS: glyphs, PALETTES, box, digitAt })
  .regs({ sc: scene })
  .on("scene", ($, s) => { $.sc = s; })
  .on("beam", ($, b) => {
    const s = $.sc;
    const lit =
      box(b.x, b.y, s.bx, s.by, 8, 8) ||
      box(b.x, b.y, 8, s.p1, 8, s.size) ||
      box(b.x, b.y, 624, s.p2, 8, s.size) ||
      (b.x.bits(9, 1) === 160 && b.y[4]) ||         // the dashed net
      digitAt(b.x, b.y, 260, s.s1) ||
      digitAt(b.x, b.y, 356, s.s2);
    const pal = PALETTES[$.palette];
    $.push("pixels", lit ? pal.fg : pal.bg);
  })
  .supervise(s => s.watchdog("20ms", $ => $.has("beam")).reset("local"))   // no beam for 20 ms: reset
  .probe(p => p.signals("sc", "palette").depth(1024).keep("before-reset"));   // the capture goes into dossiers

// ---------- sound ----------
const beeper = module("beeper")
  .needs("sfx").provides("samples")
  .lib({ K: Math.round(2 ** 24 / 48_000) })         // phase step per hertz
  .regs({ phase: u(24), step: u(20), left: u(16) })
  .on("sfx", ($, e) => { $.step = e.hz * K; $.left = e.ms * 48; })
  .every("48 kHz", $ => {
    if ($.left === 0) { $.push("samples", 0); return; }
    $.left -= 1;
    $.phase += $.step;
    $.push("samples", $.phase[23] ? 6000 : -6000);  // a square wave, the way arcades did it
  });

// ---------- runtime: a host panel and a mechanic ----------
const panel = host("panel")
  .over("bridge")
  .on("game.point", async dev => {
    const rallies = await dev.status("game.rallies").read();
    if (rallies > 20) await dev.knob("game.speed").update(v => v + 1);   // the ceiling of 6 is enforced in hardware
    dev.log(\`point after \${rallies} rallies\`);
  });

const mechanic = std.agents.mechanic
  .scope(s => s
    .read("*")
    .propose("modules/renderer", "modules/beeper", "knobs/*")
    .never("pins", "clocks", "boot", "streams"));

// ---------- the design ----------
return design("arcade")
  .board("studio")
  .clocks(c => c.pin("sys", "clk").pll("pix", { from: "sys", hz: "25.175 MHz" }))
  .use(frames, scenes, sounds, pads, game, renderer, beeper, panel, mechanic)
  .use(
    std.video.timing("beam").mode("640x480@60").domain("pix").provides("beam", "frame"),
    std.video.hdmi("hdmi").domain("pix").bind({ tmds: "hdmi" }),
    std.sigmaDelta("dac").needs("samples").bind({ out: "audio" }),
    std.bridge.uart("bridge").baud(1_000_000).bind({ uart: "uart" }))
  .wire("pads.held", "game.held")
  .use(
    group("video")
      .children("beam", "renderer", "hdmi")
      .supervise(s => s.strategy("all-for-one").maxResets(3, "10s").escalate("mechanic")),   // one stalls, all reset
    group("audio")
      .children("beeper", "dac")
      .supervise(s => s.strategy("one-for-one")))
  .boot(b => b
    .start("clocks")                                // every reset is held until the PLL locks
    .then("beam", "hdmi")                           // a black screen first, never a torn one
    .then("pads", "game", "renderer")
    .background("beeper", "dac", "bridge"))
  .regions(r => r.partition("gfx", { luts: 2500, brams: 2 }))
  .place({ renderer: "gfx" })                       // the mechanic's fixes ship as partial bitstreams
  .compile(c => c
    .check("room to grow", r => r.resources.luts <= 0.7 * r.part.luts)
    .check("pixel margin", r => r.timing.slack("pix") >= 2 || r.timing.worst("pix").explain())
    .emit("verilog", { to: "build/rtl" })
    .emit("host-js", { to: "host/arcade.js" })
    .emit("sim:wasm", { to: "build/arcade.wasm" }))
  .scenario("serve, rally, point", sc => sc
    .wait("1.1s").expectState("game", s => s.state === "play")
    .expectIrq("game.point", { within: "6s" })
    .expectFrame("hdmi", f => f.count(PALETTES[0].fg) > 0))
  .scenario("paddles move", sc => sc
    .wait("1.1s").press("btn:up", { for: "200ms" })
    .expectState("game", s => s.p1 < 208))
  .scenario("a stuck encoder resets the picture, not the game", sc => sc
    .wait("1s").hang("hdmi").wait("100ms")
    .expectResets("hdmi", 1).expectResets("renderer", 1).expectResets("game", 0))
  .scenario("night mode, no rebuild", sc => sc
    .apply(change("night").knob("renderer.palette", 1))
    .wait("40ms")
    .expectFrame("hdmi", f => f.count(PALETTES[1].bg) > 250_000))

    .repeat(4, s => s.hang("hdmi").wait("300ms"))
    .expectEscalation("video", "mechanic")          // the dossier: resets, the probe capture, the source, nearby DAG
    .approve()
    .expectChange(/./, "committed", { within: "3m" }));

## Grammar \xB7 The compiler
  .compile(c => \u2026)

  c.use(p), c.stage(name, s => s.pass(\u2026).fixpoint(\u2026))
      Start from a pipeline; declare a stage \xB7 F-13
  c.after(x, \u2026), c.before(x, \u2026), c.replace(x, p), c.when(t => \u2026, \u2026)
      Edit a pipeline, per target if needed \xB7 F-14, F-15, F-16
  c.cache(dir), c.verifyEach(), c.snapshot(\u2026), c.inspect(\u2026), c.explainPlan()
      Incremental builds and seeing inside \xB7 F-13, F-14
  c.check(name, r => true | message), c.emit(backend, opts)
      Checks on the report; outputs \xB7 F-08, F-12
  c.explore(x => x.knob(\u2026).measure(\u2026).keep(\u2026).pareto(\u2026))
      Design-space exploration \xB7 F-15
  pass(name).on(level).requires(\u2026).preserves(\u2026).params(\u2026).visit(op, fn)
      A transformation (fn is B, over the IR) \xB7 F-14
  analysis(name).on(level).run(fn)
      A cached fact about the IR \xB7 F-14
  rewrite(name).from(fn).where(fn).to(fn).examples(\u2026)
      A rule: pattern and replacement are H, the guard is B \xB7 F-14
  backend(name).on(level).emit((ir, out) => \u2026)
      An output written by walking an IR level \xB7 F-16
## Grammar \xB7 Scenarios, runtime, changes and agents
  sc.wait, .step, .poke, .press, .toggle, .uart, .feed, .throttle, .write, .hang, .repeat
      Drive the simulated design \xB7 F-01 to F-19
  sc.expectPins, .expectSignal, .expectState, .expectStream, .expectUart, .expectFrame, .expectDropped, .expectKnob, .expectIrq, .expectResets, .expectToggles
      Check it; their lambdas are R \xB7 F-01 to F-19
  async tb => \u2026 with tb.poke, tb.peek, tb.push, tb.pull, tb.random, tb.expect, tb.expectCoverage
      An imperative testbench \xB7 F-03, F-09, F-11

      A change to the running design \xB7 F-17
  .verify(v => \u2026), .deploy(d => d.partial(\u2026).canary(\u2026)), .rollbackOn(\u2026)
      How it is checked, loaded and undone \xB7 F-17
  sc.apply, .approve, .build, .expectChange, .expectBuild, .expectProposal, .expectEscalation
      Drive and check the change pipeline \xB7 F-17 to F-19
